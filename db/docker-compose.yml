# Лаб. 01 — інфраструктура для трьох баз «Кінотеатру» (запуск без Aspire)
#   SQL Server 2022 (Developer) — CinemaBooking (Проєкт №1) і CinemaCatalog (Проєкт №2)
#   MongoDB 7                   — cinema_reviews (Проєкт №3)
# Скрипти монтуються в контейнери лише для читання; розгортання — deploy.ps1.
name: cinema-lab01

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cinema-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "Cinema_Sa#2026"   # лише для локальної розробки
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
      - ./:/scripts/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\" -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  mongo:
    image: mongo:7
    container_name: cinema-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./p3:/scripts/mongo:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mssql-data:
  mongo-data:
